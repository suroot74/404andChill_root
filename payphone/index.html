  <body>
    <div class="payphone-container">
      <div class="info-row">
        <div class="info-text">
          <p>Please insert a quarter, then dial your 10-digit number.</p>
        </div>
        <div class="coin-slot"></div>
        <img src="images/pngegg.png" alt="Payphone" class="payphone-img" />
      </div>

      <div id="display" class="payphone-display">DIAL:</div>

      <div class="dial-pad">
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="pressKey('*')">*</button>
        <button onclick="pressKey('0')">0</button>
        <button onclick="pressKey('#')">#</button>
      </div>

      <div class="bottom-container">
        <div class="coin-return-slot"></div>
        <div class="bottom-text"></div>
      </div>
    </div>

    <div class="page-footer">
      <p><a href="https://phonelosers.com/" targe="_blank">Inspired by the Phone Losers of America</a></p>
