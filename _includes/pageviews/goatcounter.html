<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pv = document.getElementById('pageviews');

    if (pv !== null) {
      const uri = location.pathname.replace(/\/$/, '');
      const url = `https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/${encodeURIComponent(uri)}.json`;

      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          // Get the original count from GoatCounter
          const count = parseInt(data.count.replace(/\s/g, ''), 10);

          // Generate a random number between 322 and 592
          const randomAddition = Math.floor(Math.random() * (592 - 322 + 1)) + 322;

          // Add the random number to the count
          const adjustedCount = count + randomAddition;

          // Display the adjusted count with formatting
          pv.innerText = new Intl.NumberFormat().format(adjustedCount);
        })
        .catch((error) => {
          // Fallback in case of an error
          pv.innerText = '1';
        });
    }
  });
</script>
