    <body>
        <div class="tv-container">
            <div class="tv-static"></div>
            <div class="tv-message">NO SIGNAL</div>
            <button
                id="play-button"
                style="
                    position: absolute;
                    top: 90%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    padding: 10px 20px;
                    font-size: 1.2em;
                    color: lime;
                    background: black;
                    border: 2px solid lime;
                    border-radius: 5px;
                    cursor: pointer;
                ">
                Play Sound
            </button>
        </div>

        <audio id="static-sound" loop>
            <source src="static-sound.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>

        <footer>
            <nav>
                <a href="/">Back to 404 and Chill - Your Retro Culture Fix</a>
            </nav>
            <!-- If you're here reading this, you're either lost or one of us. Welcome to the nerd zone. -->
        </footer>

        <script>
            const playButton = document.getElementById("play-button");
            const audio = document.getElementById("static-sound");
            const messages = [
                "NO SIGNAL",
                "It’s Just Made For You",
                "Fuckin A",
                "sweet",
                "STILL NO SIGNAL",
                "Know what I mean Vern?",
                "Your fresh breath goes on and on",
                "TRY MOVING THE ANTENNA",
                "I don't wanna grow up",
                "The Real Thing",
                "PUT FOIL ON THE ANTENNA"
            ];
            const tvMessage = document.querySelector(".tv-message");

            const randomInterval = () => Math.floor(Math.random() * 20000) + 20000; // 20 to 40 seconds

            const updateMessage = () => {
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                tvMessage.textContent = randomMessage;
                tvMessage.style.opacity = 1;
                setTimeout(() => {
                    tvMessage.style.opacity = 0;
                }, 5000); // Visible for 5 seconds
                setTimeout(updateMessage, randomInterval());
            };

            setTimeout(updateMessage, randomInterval());

            playButton.addEventListener("click", () => {
                audio.play();
                playButton.textContent = "Static Mode: ON";
                playButton.style.opacity = "0.8";
            });

            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key === "s") {
                    alert("Static is life. You can’t save it.");
                }
            });
        </script>
        <script data-goatcounter="https://404andchill.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </body>
