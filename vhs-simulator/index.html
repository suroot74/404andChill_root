    <body>
        <div class="vhs-container">
            <div class="vhs-screen">
                <div class="vhs-video-wrapper">
                    <video id="vhs-video" autoplay loop muted>
                        <source src="vhs.mp4" type="video/mp4" />
                        Your browser does not support the video tag.
                    </video>
                    <div class="vhs-glitches"></div>
                </div>
            </div>

            <div class="vhs-controls">
                <button class="vhs-button" id="play-btn">▶️ Play</button>
                <button class="vhs-button" id="pause-btn">⏸ Pause</button>
                <button class="vhs-button" id="rewind-btn">⏪ Rewind</button>
                <button class="vhs-button" id="fast-forward-btn">⏩ Fast Forward</button>
                <button class="vhs-button" id="eject-btn">⏏️ Eject</button>
            </div>
